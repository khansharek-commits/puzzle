<title>Unit One Lessons</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one centred reading column; a lesson is a card that advances step by step. */
:root {
  --bg: #f4f3ef; --surface: #ffffff; --ink: #1d1f24; --muted: #62666f; --line: #dddbd3;
  --good: #1f7a4d; --good-bg: #e6f3ec; --bad: #b23a2e; --bad-bg: #f8e9e6;
  --econ: #23855f; --sci: #2f6fb8; --his: #b06a1c;
  --font-head: 'Space Grotesk', system-ui, sans-serif; --font-body: 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171b; --surface: #1e2127; --ink: #eceae4; --muted: #9da1aa; --line: #30343c;
  --good: #5fcf94; --good-bg: #183026; --bad: #f08a7c; --bad-bg: #3a1f1c;
  --econ: #4cc18f; --sci: #6aa4ec; --his: #e3a256; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15171b; --surface: #1e2127; --ink: #eceae4; --muted: #9da1aa; --line: #30343c;
  --good: #5fcf94; --good-bg: #183026; --bad: #f08a7c; --bad-bg: #3a1f1c;
  --econ: #4cc18f; --sci: #6aa4ec; --his: #e3a256; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 var(--font-body); }
main { max-width: 720px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-head); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); }
h2 { font-size: 1.35rem; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--c, var(--sci)); outline-offset: 2px; border-radius: 6px; }
.eyebrow { margin: 0; font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--c, var(--muted)); }
.muted { color: var(--muted); }
.note { font-size: .9rem; color: var(--muted); margin: 0; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn.primary { background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.back { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-weight: 600; }
.back:hover { color: var(--ink); }

/* home */
.courses { display: grid; gap: 14px; }
.course { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.course-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.course-head h2 { color: var(--c); }
.lessons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lesson-btn { width: 100%; display: flex; gap: 12px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
.lesson-btn:hover { border-color: var(--c); }
.num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 .85rem var(--font-head); background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); }
.lesson-btn.done .num { background: var(--c); color: #fff; }
.lesson-btn span:last-child { min-width: 0; }

/* player */
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); transition: width .3s ease; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(20px, 4vw, 30px); display: flex; flex-direction: column; gap: 16px; }
.card p { margin: 0; }
.teach-text { display: flex; flex-direction: column; gap: 12px; font-size: 1.08rem; }
.teach-text ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
.prompt { font: 600 1.2rem/1.4 var(--font-head); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--c); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.num-row { display: flex; gap: 8px; flex-wrap: wrap; }
.num-row input { flex: 1 1 140px; max-width: 220px; min-width: 0; padding: 10px 12px; font: 600 1.1rem var(--font-body); border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.order-zone { display: flex; flex-direction: column; gap: 6px; min-height: 48px; padding: 8px; border: 1px dashed var(--line); border-radius: 10px; }
.order-zone:empty::before { content: "Tap the items below in order"; color: var(--muted); font-size: .9rem; padding: 4px 6px; }
.chip { text-align: left; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
.chip.placed { background: color-mix(in srgb, var(--c) 12%, var(--surface)); border-color: var(--c); }
.chip.right { border-color: var(--good); background: var(--good-bg); }
.chip.wrong { border-color: var(--bad); background: var(--bad-bg); }
.result { border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.result.good { background: var(--good-bg); } .result.bad { background: var(--bad-bg); }
.result b { color: var(--good); } .result.bad b { color: var(--bad); }
.recap ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
.actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.stat { font: 700 2.4rem var(--font-head); color: var(--c); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<main id="app"></main>

<script>
const COURSES = /*CONTENT*/[];
const COLORS = { economics: 'var(--econ)', science: 'var(--sci)', history: 'var(--his)' };
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const app = $('#app');
let done = {};
try { done = JSON.parse(localStorage.getItem('lesson-preview-done') || '{}'); } catch (e) {}
const markDone = (id) => { done[id] = true; try { localStorage.setItem('lesson-preview-done', JSON.stringify(done)); } catch (e) {} };

function paragraphs(text) {
  return text.split('\n\n').map((block) => {
    const lines = block.split('\n');
    if (lines.every((l) => l.startsWith('•'))) return `<ul>${lines.map((l) => `<li>${esc(l.slice(1).trim())}</li>`).join('')}</ul>`;
    const bullets = lines.filter((l) => l.startsWith('•'));
    if (bullets.length) return `<p>${esc(lines.filter((l) => !l.startsWith('•')).join(' '))}</p><ul>${bullets.map((l) => `<li>${esc(l.slice(1).trim())}</li>`).join('')}</ul>`;
    return `<p>${esc(block)}</p>`;
  }).join('');
}

function home() {
  document.documentElement.style.removeProperty('--c');
  app.innerHTML = `
    <header><p class="eyebrow">Content preview</p><h1>Three courses, one unit each</h1>
      <p class="muted">Each lesson starts with a guess, teaches one idea in small steps, makes you use it, and ends with a recap and the cards that will come back in spaced review. The final look of the game will come from your artwork.</p></header>
    <div class="courses">${COURSES.map((c) => {
      const u = c.units[0];
      return `<section class="course" style="--c:${COLORS[c.id]}">
        <div class="course-head"><h2>${esc(c.title)}</h2><span class="note">Unit 1 · ${esc(u.title)}</span></div>
        <p class="muted" style="margin:0">${esc(c.tagline)}</p>
        <ol class="lessons">${u.lessons.map((l, i) => `<li><button class="lesson-btn ${done[l.id] ? 'done' : ''}" data-c="${c.id}" data-l="${l.id}">
          <span class="num">${done[l.id] ? '✓' : i + 1}</span><span><strong>${esc(l.title)}</strong><br><span class="note">${esc(l.goal)}</span></span></button></li>`).join('')}</ol>
      </section>`; }).join('')}</div>`;
  app.querySelectorAll('.lesson-btn').forEach((b) => b.onclick = () => {
    const c = COURSES.find((x) => x.id === b.dataset.c);
    play(c, c.units[0].lessons.find((l) => l.id === b.dataset.l));
  });
}

function play(course, lesson) {
  document.documentElement.style.setProperty('--c', COLORS[course.id]);
  const steps = lesson.steps, idx = course.units[0].lessons.indexOf(lesson) + 1;
  let i = 0, right = 0, asked = 0;
  const frame = (inner, canGo, label = 'Continue') => {
    app.innerHTML = `
      <button class="back" id="back">← All lessons</button>
      <div><p class="eyebrow">${esc(course.title)} · Lesson ${idx}</p><h1>${esc(lesson.title)}</h1></div>
      <div class="bar" aria-label="Step ${i + 1} of ${steps.length}"><i style="width:${(i / steps.length) * 100}%"></i></div>
      <article class="card">${inner}</article>
      <div class="actions"><button class="btn primary" id="go" ${canGo ? '' : 'disabled'}>${label}</button></div>`;
    $('#back').onclick = home;
    $('#go').onclick = () => { i++; i < steps.length ? show() : finish(); };
    window.scrollTo(0, 0);
  };
  const show = () => {
    const s = steps[i];
    if (s.type === 'teach') return frame(`<h2>${esc(s.title)}</h2><div class="teach-text">${paragraphs(s.text)}</div>`, true);
    if (s.type === 'recap') return frame(`<div class="recap"><p class="eyebrow">Recap</p><ul>${s.points.map((p) => `<li>${esc(p)}</li>`).join('')}</ul></div>`, true, 'Finish lesson');
    asked++;
    frame(`<p class="prompt">${esc(s.prompt)}</p><div id="q"></div><div id="res"></div>`, false);
    askQuestion(s, $('#q'), (ok, fb) => {
      if (ok) right++;
      $('#res').innerHTML = `<div class="result ${ok ? 'good' : 'bad'}"><b>${ok ? 'Correct' : 'Not quite'}</b>${fb ? `<p>${esc(fb)}</p>` : ''}<p>${esc(s.explain)}</p></div>`;
      $('#go').disabled = false; $('#go').focus();
    });
  };
  const finish = () => {
    markDone(lesson.id);
    const next = course.units[0].lessons[idx];
    app.innerHTML = `
      <button class="back" id="back">← All lessons</button>
      <article class="card"><p class="eyebrow">${esc(course.title)} · Lesson ${idx} complete</p><h1>${esc(lesson.title)}</h1>
        <div class="stat">${right} / ${asked}</div><p class="muted">questions right first time</p>
        <p>In the full game, the ${lesson.review.length} review cards below come back after 1, 3, 7, 14 and 30 days, just as you start to forget. You can try them now.</p></article>
      <div class="actions"><button class="btn" id="rev">Try the review cards</button>${next ? `<button class="btn primary" id="next">Next: ${esc(next.title)}</button>` : '<button class="btn primary" id="home">All lessons</button>'}</div>`;
    $('#back').onclick = home;
    $('#rev').onclick = () => review(course, lesson);
    if (next) $('#next').onclick = () => play(course, next); else $('#home').onclick = home;
  };
  show();
}

function review(course, lesson) {
  let k = 0;
  const step = () => {
    const r = lesson.review[k];
    app.innerHTML = `
      <button class="back" id="back">← All lessons</button>
      <div><p class="eyebrow">Spaced review · card ${k + 1} of ${lesson.review.length}</p><h1>${esc(lesson.title)}</h1></div>
      <article class="card"><p class="prompt">${esc(r.prompt)}</p><div id="q"></div><div id="res"></div></article>
      <div class="actions"><button class="btn primary" id="go" disabled>${k === lesson.review.length - 1 ? 'Back to all lessons' : 'Next card'}</button></div>`;
    $('#back').onclick = home;
    askQuestion(r, $('#q'), (ok) => {
      $('#res').innerHTML = `<div class="result ${ok ? 'good' : 'bad'}"><b>${ok ? 'Remembered' : 'Forgotten'}</b><p>${esc(r.explain)}</p><p class="note">${ok ? 'Next review in a longer gap.' : 'This card would come back tomorrow.'}</p></div>`;
      $('#go').disabled = false; $('#go').focus();
    });
    $('#go').onclick = () => { k++; k < lesson.review.length ? step() : home(); };
  };
  step();
}

function askQuestion(q, box, done) {
  if (q.kind === 'choice') {
    box.innerHTML = `<div class="opts">${q.options.map((o, n) => `<button class="opt" data-n="${n}">${esc(o)}</button>`).join('')}</div>`;
    box.querySelectorAll('.opt').forEach((b) => b.onclick = () => {
      const n = +b.dataset.n, ok = n === q.answer;
      box.querySelectorAll('.opt').forEach((x) => { x.disabled = true; if (+x.dataset.n === q.answer) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      done(ok, !ok && q.feedback && q.feedback[n]);
    });
  } else if (q.kind === 'number') {
    box.innerHTML = `<form class="num-row" id="nf"><input id="nin" inputmode="decimal" autocomplete="off" aria-label="Your answer"><button class="btn primary" type="submit">Check</button></form>`;
    $('#nf').onsubmit = (e) => {
      e.preventDefault();
      const v = parseFloat($('#nin').value.replace(/,/g, '')); if (isNaN(v)) return;
      const ok = Math.abs(v - q.answer) <= (q.tolerance || 0);
      box.querySelectorAll('input, button').forEach((x) => (x.disabled = true));
      done(ok, ok ? '' : `The answer is ${q.answer}.`);
    };
    $('#nin').focus();
  } else if (q.kind === 'order') {
    const pool = shuffle(q.items), placed = [];
    const draw = () => {
      box.innerHTML = `<div class="order-zone" id="zone">${placed.map((t) => `<button class="chip placed" data-t="${esc(t)}">${placed.indexOf(t) + 1}. ${esc(t)}</button>`).join('')}</div>
        <div class="opts" style="margin-top:10px">${pool.filter((t) => !placed.includes(t)).map((t) => `<button class="chip" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
        <div class="actions" style="margin-top:10px"><button class="btn" id="oc" ${placed.length === q.items.length ? '' : 'disabled'}>Check order</button></div>`;
      box.querySelectorAll('.chip').forEach((b) => b.onclick = () => {
        const t = b.dataset.t; const at = placed.indexOf(t);
        at >= 0 ? placed.splice(at, 1) : placed.push(t); draw();
      });
      $('#oc').onclick = () => {
        const ok = placed.every((t, n) => t === q.answer[n]);
        box.querySelectorAll('.chip').forEach((c) => { c.disabled = true; const n = placed.indexOf(c.dataset.t); c.classList.add(q.answer[n] === c.dataset.t ? 'right' : 'wrong'); });
        $('#oc').remove();
        done(ok, ok ? '' : 'Correct order: ' + q.answer.join(' → '));
      };
    };
    draw();
  }
}

home();
</script>
